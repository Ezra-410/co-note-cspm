# =============================================================================
# Prowler mutelist = ACCEPTED risks only (registers/exceptions.csv).
# Muted findings are still reported (status "MUTED" in data/prowler_findings.csv)
# but are excluded from the CriticalFindings/HighFindings alarms -> the alarms
# only fire for risks nobody has decided on (alert-fatigue control).
# Every entry must reference an exception with an owner and an expiry date.
# Review this file whenever an exception expires (all: 2026-12-31).
# =============================================================================
